apiVersion: 1

datasources:
  - name: InfluxDB-IOx
    type: influxdata-flightsql-datasource
    access: proxy
    url: localhost:8086
    jsonData:
      host: solarflow-influxdb:8086
      metadata:
        - database: solarflow_metrics
    secureJsonData:
      token: ${INFLUX_ADMIN_TOKEN}
    isDefault: true
